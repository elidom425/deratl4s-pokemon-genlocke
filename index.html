function pull(alive,sel){
 let g;try{g=JSON.parse(localStorage.getItem("gl_state"))}catch(e){}
 if(!g||g.length!=G.length)g=init();
 const all=[];
 g.forEach((x,i)=>{
  if(alive){
   const dead=new Set([...dl(x),...(x.ch||[]).filter(c=>!c.a).map(c=>c.n)].map(n=>(n||"").trim().toLowerCase()));
   const add=l=>l.forEach(n=>{if(n&&!dead.has(n.trim().toLowerCase()))all.push(n)});
   if(sel=="cur"){if(x.s==1){add(x.team);add(bl(x))}}
   else if(i==+sel){if(x.s==1)add(x.team);if(x.s==2)add(x.ch.filter(c=>c.a).map(c=>c.n));add(bl(x))}}
  else if(i==+sel){dl(x).forEach(n=>all.push(n));x.ch.filter(c=>!c.a).forEach(c=>all.push(c.n))}});
 const seen=new Set();
 return all.map(n=>n.trim()).filter(n=>{const k=n.toLowerCase();if(!n||seen.has(k))return false;seen.add(k);return true})}

function syncEnc(){try{
 if(!isAdmin())return;
 const g=JSON.parse(localStorage.getItem("gl_state"));if(!Array.isArray(g))return;
 let l=[];try{const v=JSON.parse(localStorage.getItem("gl_enc"));if(Array.isArray(v))l=v.map(x=>typeof x=="string"?{n:x,f:"",g:"",r:false}:{g:"",r:false,...x})}catch(e){}
 const kk=t=>t.trim().toLowerCase(),n0=l.length,found=[];
 g.forEach((x,i)=>{[...(x.team||[]),...bl(x),...dl(x),...(x.ch||[]).map(c=>c.n)].map(n=>(n||"").trim()).filter(Boolean).forEach(n=>found.push([n,i]))});
 const cur=new Set(found.map(([n])=>kk(n)));
 // Alt-Müll (Tipp-Fragmente) entfernen: unbearbeitete Einträge, die nur Anfang eines anderen Namens sind
 l=l.filter(e=>e.f||e.r||cur.has(kk(e.n))||!l.some(o=>o!==e&&kk(o.n).length>kk(e.n).length&&kk(o.n).startsWith(kk(e.n))));
